[project]
name = "doclens"
version = "1.0.0"
description = "A documentation-grounded engineering assistant and retrieval lab"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu==1.12.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "numpy==2.2.6",
    "rank-bm25==0.2.2",
    "scikit-learn==1.7.2",
    "snowballstemmer==3.0.1",
    "uvicorn==0.40.0",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers==5.1.2",
    "torch==2.9.1",
    "transformers==4.57.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
